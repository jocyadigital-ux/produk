<body>
<!-- AUTH GATE -->

<!-- FORGOT MODAL -->
<div id="forgot-modal" style="display:none;position:fixed;inset:0;z-index:100001;background:rgba(0,0,0,0.8);align-items:center;justify-content:center;padding:20px;">
<div style="background:#121216;border:1px solid rgba(255,255,255,0.08);border-radius:20px;padding:28px;max-width:400px;width:100%;">
<h3 style="color:#fff;font-size:16px;font-weight:700;margin-bottom:6px;">Lupa Password?</h3>
<p style="color:rgba(255,255,255,0.5);font-size:12px;margin-bottom:18px;line-height:1.5;">Masukkan nomor HP terdaftar. Jika akun ditemukan, kamu bisa lihat password lama atau reset langsung.</p>
<input id="forgot-phone" placeholder="Nomor HP 0812xxxx" style="width:100%;background:#0a0a0f;border:1px solid rgba(255,255,255,0.08);border-radius:12px;padding:12px 16px;color:#fff;font-size:14px;outline:none;margin-bottom:12px;"/>
<div id="forgot-result" style="display:none;margin-bottom:14px;padding:10px 12px;border-radius:10px;font-size:12px;"></div>
<div style="display:flex;gap:10px;">
<button id="forgot-check" style="flex:1;background:#38bdf8;color:#000;font-weight:700;padding:11px;border-radius:10px;border:none;cursor:pointer;">Cek Akun</button>
<button onclick="document.getElementById('forgot-modal').style.display='none'" style="flex:1;background:rgba(255,255,255,0.06);color:#fff;border:1px solid rgba(255,255,255,0.1);padding:11px;border-radius:10px;cursor:pointer;">Tutup</button>
</div>
<div id="forgot-reset-area" style="display:none;margin-top:16px;border-top:1px solid rgba(255,255,255,0.06);padding-top:16px;">
<input id="forgot-new-pass" placeholder="Password baru" style="width:100%;background:#0a0a0f;border:1px solid rgba(255,255,255,0.08);border-radius:12px;padding:12px 16px;color:#fff;font-size:14px;outline:none;margin-bottom:10px;" type="text"/>
<button id="forgot-save" style="width:100%;background:#fff;color:#000;font-weight:600;padding:11px;border-radius:10px;border:none;cursor:pointer;">Simpan Password Baru</button>
</div>
</div>
</div>

<div id="admin-bar" style="display:none;position:fixed;top:0;left:0;right:0;z-index:9998;background:#0a0a0f;border-bottom:1px solid rgba(255,255,255,0.08);height:48px;padding:0 16px;align-items:center;justify-content:space-between;">
<div style="display:flex;align-items:center;gap:8px;color:#fff;font-size:12px;font-weight:600;">JD • JOCY DIGITAL • Prompt referensi foto <span style="opacity:0.4;font-weight:400;margin-left:8px;">LIVE DATABASE</span></div>
<div style="display:flex;gap:8px;align-items:center;">
<span id="admin-user-info" style="background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);color:rgba(255,255,255,0.7);font-size:11px;padding:6px 12px;border-radius:20px;"></span>
<button id="btn-admin-panel" style="display:none;background:#2a1f4d;border:1px solid rgba(139,92,246,0.3);color:#a78bfa;padding:6px 14px;border-radius:20px;font-size:12px;cursor:pointer;">Admin</button>
<button id="btn-logout" style="background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);color:#fff;padding:6px 14px;border-radius:20px;font-size:12px;cursor:pointer;">Logout</button>
</div>
</div>
<div id="admin-panel" style="display:none;position:fixed;inset:0;top:48px;z-index:9997;background:#070709;overflow:auto;padding:24px;">
<div style="max-width:900px;margin:0 auto;">
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
<h2 style="color:#fff;font-size:18px;font-weight:700;">Panel Admin</h2>
<button onclick="document.getElementById('admin-panel').style.display='none'" style="background:#fff;color:#000;padding:8px 14px;border-radius:8px;border:none;cursor:pointer;">Kembali</button>
</div>
<div id="admin-users-list"></div>
</div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
(function(){
  const firebaseConfig = {
    apiKey: "AIzaSyAtiw8OXoNmG4L5GyZuBU6ksZ-eU1zmW9U",
    authDomain: "jocya-4f699.firebaseapp.com",
    projectId: "jocya-4f699",
    storageBucket: "jocya-4f699.firebasestorage.app",
    messagingSenderId: "1054341670735",
    appId: "1:1054341670735:web:0a64275e552e2e8203073a"
  };
  const ADMIN_PHONE="";
  const ADMIN_PASS="";
  let db=null;
  let firebaseReady=false;
  try{
    firebase.initializeApp(firebaseConfig);
    db=firebase.firestore();
    // Aktifkan offline persistence biar tetap jalan kalau sinyal putus
    db.enablePersistence({synchronizeTabs:true}).catch(()=>{});
    firebaseReady=true;
    console.log("%c Firebase JOCYA CONNECTED OK","background:#00c853;color:#fff;padding:4px 8px;border-radius:4px");
    
    // AUTO SYNC: Ambil semua user dari cloud ke localStorage saat load
    db.collection("users5").get().then(snap=>{
      if(!snap.empty){
        let cloudUsers=[];
        snap.forEach(doc=>cloudUsers.push(doc.data()));
        // Merge dengan local, cloud menang
        let local = [];
        try{ local = JSON.parse(localStorage.getItem("jocy_users5")||"[]"); }catch{}
        let mergedMap = {};
        [...local, ...cloudUsers].forEach(u=>{ mergedMap[u.phone]=u; });
        let merged = Object.values(mergedMap);
        localStorage.setItem("jocy_users5", JSON.stringify(merged));
        console.log("Synced", merged.length, "users from Firestore");
      }
    }).catch(e=>console.warn("Sync fail, cek Firestore Rules", e));

    // REAL-TIME LISTENER: Jika ada perubahan di Firestore, update local otomatis
    db.collection("users5").onSnapshot(snap=>{
      let cloudUsers=[];
      snap.forEach(doc=>cloudUsers.push(doc.data()));
      if(cloudUsers.length>0){
        let mergedMap={};
        cloudUsers.forEach(u=>{ mergedMap[u.phone]=u; });
        localStorage.setItem("jocy_users5", JSON.stringify(Object.values(mergedMap)));
        // Jika admin panel terbuka, re-render
        if(document.getElementById("admin-panel") && document.getElementById("admin-panel").style.display!=="none"){
          if(window._jocy_render) window._jocy_render();
        }
      }
    }, err=>console.warn("Realtime listener error", err));

  }catch(e){ console.warn("Firebase fail",e); }

  function $(id){ return document.getElementById(id); }
  function norm(p){ return (p||"").replace(/\s+/g,'').trim(); }
  function getUsers(){
    try{ return JSON.parse(localStorage.getItem("jocy_users5")||"[]"); }catch{ return []; }
  }
  function saveUser(u){
    let arr=getUsers();
    let idx=arr.findIndex(x=>x.phone===u.phone);
    if(idx>=0) arr[idx]=u; else arr.push(u);
    localStorage.setItem("jocy_users5", JSON.stringify(arr));
    if(db){
      db.collection("users5").doc(u.phone).set({...u, updatedAt: firebase.firestore.FieldValue.serverTimestamp()}, {merge:true}).catch(()=>{});
    }
    return arr;
  }

  // seed removed - no admin panel
  (function seed(){}){
    let arr=getUsers();
    if(arr.length===0){
      saveUser({phone:ADMIN_PHONE,password:ADMIN_PASS,name:"Admin Jocy",status:"approved",isAdmin:true});
      saveUser({phone:"08129990832",password:"naruto",name:"User 0812",status:"approved",isAdmin:false});
    } else {
      // ensure admin exists with correct pass
      let admin=arr.find(x=>x.phone===ADMIN_PHONE);
      if(!admin){
        saveUser({phone:ADMIN_PHONE,password:ADMIN_PASS,name:"Admin Jocy",status:"approved",isAdmin:true});
      } else if(admin.password!==ADMIN_PASS){
        admin.password=ADMIN_PASS;
        admin.status="approved";
        admin.isAdmin=true;
        saveUser(admin);
      }
      // ensure test user
      let test=arr.find(x=>x.phone==="08129990832");
      if(!test){
        saveUser({phone:"08129990832",password:"naruto",name:"User 0812",status:"approved",isAdmin:false});
      }
    }
  })();

  function loginSuccess(u){
    localStorage.setItem("jocy_user", JSON.stringify(u));
    const gate=$("auth-gate");
    if(gate) gate.style.display="none";
    document.body.style.paddingTop="0px";
    // make root visible
    const root=document.getElementById("root");
    if(root) root.style.display="block";
  }

  function check(){
    try{
      const saved=JSON.parse(localStorage.getItem("jocy_user")||"null");
      if(saved && (saved.status==="approved" || saved.isAdmin)){
        loginSuccess(saved);
        return true;
      }
    }catch{}
    // hide root until login
    const root=document.getElementById("root");
    if(root) root.style.display="none";
    return false;
  }

  async function doLogin(){
    const phone=norm($("auth-phone").value);
    const pass=$("auth-pass").value;
    const err=$("auth-error");
    if(!phone||!pass){
      err.textContent="Isi Nomor HP dan Password";
      err.style.display="block";
      return;
    }
    const btn=$("auth-login-btn");
    btn.textContent="Memproses...";
    btn.disabled=true;

    let users=getUsers();
    let found=users.find(u=>u.phone===phone);

    // try firestore if not found locally
    if(!found && db){
      try{
        const docSnap=await db.collection("users5").doc(phone).get();
        if(docSnap.exists){
          found={phone, ...docSnap.data()};
          saveUser(found);
        }
      }catch(e){ console.warn(e); }
    }

    if(!found){
      err.textContent="Akun tidak ditemukan. Silakan Daftar Baru di bawah.";
      err.style.display="block";
      btn.textContent="Masuk";
      btn.disabled=false;
      return;
    }
    if(found.password!==pass){
      err.textContent="Password salah";
      err.style.display="block";
      btn.textContent="Masuk";
      btn.disabled=false;
      return;
    }
    if(found.status==="pending"){
      $("pending-phone").textContent=phone;
      $("pending-modal").style.display="flex";
      btn.textContent="Masuk";
      btn.disabled=false;
      return;
    }
    loginSuccess(found);
    btn.textContent="Masuk";
    btn.disabled=false;
  }

  // events
  $("auth-login-btn").addEventListener("click", doLogin);
  $("auth-pass").addEventListener("keydown", e=>{ if(e.key==="Enter") doLogin(); });
  $("auth-phone").addEventListener("keydown", e=>{ if(e.key==="Enter") doLogin(); });
  $("auth-phone").addEventListener("input", e=>{
    const hint=$("auth-admin-hint");
    hint.style.display="none"; // hidden per request
  });

  $("auth-to-reg").addEventListener("click", ()=>{ $("auth-reg-form").style.display="block"; });
  $("auth-to-login").addEventListener("click", ()=>{ $("auth-reg-form").style.display="none"; });

  $("reg-btn").addEventListener("click", ()=>{
    const name=$("reg-name").value.trim();
    const phone=norm($("reg-phone").value);
    const pass=$("reg-pass").value;
    if(!name||!phone||!pass){ alert("Lengkapi semua"); return; }
    let users=getUsers();
    if(users.find(u=>u.phone===phone)){ alert("Sudah terdaftar"); return; }
    const isAdmin=phone===ADMIN_PHONE;
    const nu={phone,name,password:pass,status:isAdmin?"approved":"pending",isAdmin};
    saveUser(nu);
    if(isAdmin) loginSuccess(nu);
    else {
      $("pending-phone").textContent=phone;
      $("pending-modal").style.display="flex";
      $("auth-reg-form").style.display="none";
    }
  });

  $("btn-logout").addEventListener("click", ()=>{
    localStorage.removeItem("jocy_user");
    location.reload();
  });
  $("btn-admin-panel").addEventListener("click", ()=>{
    $("admin-panel").style.display="block";
    render();
  });

  window.approve=function(){};
  window.del=function(){};


  // --- Toggle Panel Login / Daftar Terpisah (FIX numpuk) ---
  $("auth-to-reg").addEventListener("click", ()=>{ 
    $("login-main").style.display="none"; 
    $("auth-reg-form").style.display="flex"; 
    $("auth-error").style.display="none";
  });
  $("auth-to-login").addEventListener("click", ()=>{ 
    $("auth-reg-form").style.display="none"; 
    $("login-main").style.display="flex"; 
  });

  $("reg-btn").addEventListener("click", ()=>{
    const phone=norm($("reg-phone").value);
    const pass=$("reg-pass").value;
    const name="User "+phone.slice(-4);
    if(!phone||!pass){ alert("Lengkapi Nomor HP dan Password"); return; }
    let users=getUsers();
    if(users.find(u=>u.phone===phone)){ alert("Sudah terdaftar"); return; }
    const isAdmin=phone===ADMIN_PHONE;
    const nu={phone,name,password:pass,status:isAdmin?"approved":"pending",isAdmin};
    saveUser(nu);
    if(isAdmin) loginSuccess(nu);
    else {
      $("pending-phone").textContent=phone;
      $("pending-modal").style.display="flex";
      $("auth-reg-form").style.display="none";
      $("login-main").style.display="flex";
    }
  });

  // --- Eye toggle ---
  (function(){
    const tp=document.getElementById('toggle-pass');
    if(tp){ tp.addEventListener('click', ()=>{ const i=document.getElementById('auth-pass'); const ic=document.getElementById('eye-icon'); if(i.type==='password'){ i.type='text'; ic.textContent='🙈'; } else { i.type='password'; ic.textContent='👁️'; } }); }
    const tr=document.getElementById('toggle-reg-pass');
    if(tr){ tr.addEventListener('click', ()=>{ const i=document.getElementById('reg-pass'); const ic=document.getElementById('eye-reg-icon'); if(i.type==='password'){ i.type='text'; ic.textContent='🙈'; } else { i.type='password'; ic.textContent='👁️'; } }); }
    const forgotLink=document.getElementById('forgot-pass-link');
    const forgotModal=document.getElementById('forgot-modal');
    const forgotPhone=document.getElementById('forgot-phone');
    const forgotResult=document.getElementById('forgot-result');
    const forgotCheck=document.getElementById('forgot-check');
    const forgotResetArea=document.getElementById('forgot-reset-area');
    const forgotNewPass=document.getElementById('forgot-new-pass');
    const forgotSave=document.getElementById('forgot-save');
    let currentForgotUser=null;
    if(forgotLink){ forgotLink.addEventListener('click', ()=>{ forgotModal.style.display='flex'; forgotResult.style.display='none'; forgotResetArea.style.display='none'; forgotPhone.value=document.getElementById('auth-phone').value.trim(); }); }
    if(forgotCheck){ forgotCheck.addEventListener('click', ()=>{ const ph=(forgotPhone.value||'').replace(/\s+/g,'').trim(); if(!ph){ forgotResult.style.display='block'; forgotResult.style.background='rgba(239,68,68,0.1)'; forgotResult.style.border='1px solid rgba(239,68,68,0.2)'; forgotResult.style.color='#fca5a5'; forgotResult.textContent='Isi nomor HP dulu'; return; } let arr=[]; try{ arr=JSON.parse(localStorage.getItem('jocy_users5')||'[]'); }catch{ arr=[]; } let u=arr.find(x=>x.phone===ph); if(!u){ forgotResult.style.display='block'; forgotResult.style.background='rgba(239,68,68,0.1)'; forgotResult.style.border='1px solid rgba(239,68,68,0.2)'; forgotResult.style.color='#fca5a5'; forgotResult.textContent='Nomor tidak ditemukan. Hubungi admin ADMIN_REMOVED'; forgotResetArea.style.display='none'; currentForgotUser=null; return; } currentForgotUser=u; forgotResult.style.display='block'; forgotResult.style.background='rgba(56,189,248,0.1)'; forgotResult.style.border='1px solid rgba(56,189,248,0.2)'; forgotResult.style.color='#7dd3fc'; forgotResult.innerHTML='Akun: <b>'+u.name+'</b><br>Pass: <span style=color:#fff;font-weight:700>'+u.password+'</span>'; forgotResetArea.style.display='block'; forgotNewPass.value=u.password; }); }
    if(forgotSave){ forgotSave.addEventListener('click', ()=>{ if(!currentForgotUser){ alert('Cek akun dulu'); return; } const np=forgotNewPass.value.trim(); if(!np){ alert('Isi password baru'); return; } let arr=[]; try{ arr=JSON.parse(localStorage.getItem('jocy_users5')||'[]'); }catch{ arr=[]; } arr=arr.map(x=> x.phone===currentForgotUser.phone? {...x, password:np} : x); localStorage.setItem('jocy_users5', JSON.stringify(arr)); try{ if(window.firebase && firebase.firestore){ firebase.firestore().collection('users5').doc(currentForgotUser.phone).update({password:np}); } }catch{} forgotResult.style.background='rgba(34,197,94,0.12)'; forgotResult.style.border='1px solid rgba(34,197,94,0.2)'; forgotResult.style.color='#86efac'; forgotResult.textContent='Password diganti!'; setTimeout(()=>{ forgotModal.style.display='none'; document.getElementById('auth-pass').value=np; }, 1000); }); }
  })();

  check();
})();
</script>
<script>
(function(){
  function getContext(){
    let dialog = '';
    try{
      const tas = Array.from(document.querySelectorAll('textarea'));
      const dialogTA = tas.find(t=> (t.placeholder||'').toLowerCase().includes('dialog') || (t.placeholder||'').toLowerCase().includes('diucapkan')) || tas[0];
      if(dialogTA) dialog = dialogTA.value.trim();
    }catch{}
    let country = 'Indonesia';
    try{
      const sel = document.querySelector('select');
      if(sel && sel.value) country = sel.value;
    }catch{}
    return {dialog, country};
  }
  function generateHashtags(){
    const {country} = getContext();
    // hashtag bersih, relevan, tanpa brand JOCYA
    const tags = [
      '#Veo3', '#GoogleVeo3', '#AIVideoGenerator', '#FotoJadiVideo', '#ImageToVideo',
      '#CinematicVideo', '#Photorealistic', '#AestheticVideo', '#VideoAI',
      '#TutorialVeo', '#PromptVeo', '#AIViral',
      '#' + (country||'Indonesia').replace(/\s+/g,''),
      '#Indonesia', '#KontenKreator'
    ];
    const fyp = ['#FYP', '#ForYouPage', '#Viral', '#FYPシ', '#FYPIndonesia'];
    return [...tags, ...fyp].join(' ');
  }
  function generateDescription(){
    const {dialog, country} = getContext();
    let desc = '';
    if(dialog){
      // pakai dialog sebagai hook utama
      desc = `“${dialog}”\n\n`;
    } else {
      desc = `Behind the scene versi AI ✨\n\n`;
    }
    desc += `Foto statis jadi video sinematik yang natural, gerakan bibir sinkron, kulit tetap realistis dan identitas wajah konsisten. Cocok buat konten ${country} yang pengen kelihatan effortless tapi premium.\n\n`;
    desc += `📸 Tips: pakai foto HD + video referensi 3-8 detik biar hasil lebih stabil.\n`;
    desc += `Simpan dulu, cobain nanti, dan share hasilnya!\n`;
    return desc;
  }
  function generateFullPackage(){
    return generateDescription() + "\n\n" + generateHashtags();
  }
  function copyText(txt, btn){
    navigator.clipboard.writeText(txt).then(()=>{
      const orig = btn.innerHTML;
      btn.innerHTML = 'OK ✓';
      btn.style.background = '#00c853';
      btn.style.color = '#fff';
      setTimeout(()=>{ btn.innerHTML = orig; btn.style.background=''; btn.style.color=''; }, 1500);
    });
  }
  function injectSocialPanel(){
    // cek sudah ada
    if(document.getElementById('jocy-social-panel')) return;
    // cari grid copy prompt utama
    const candidates = Array.from(document.querySelectorAll('button'));
    const copyMainBtn = candidates.find(b=>b.textContent.includes('Copy Prompt Utama'));
    if(!copyMainBtn) return;
    const gridParent = copyMainBtn.closest('div.grid') || copyMainBtn.parentElement.parentElement;
    if(!gridParent) return;
    
    const panel = document.createElement('div');
    panel.id = 'jocy-social-panel';
    panel.style.cssText = 'margin-top:12px;border:1px solid rgba(255,255,255,0.06);background:rgba(255,255,255,0.02);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;';
    panel.innerHTML = `
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:2px;">
        <div style="width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,#ec4899,#8b5cf6);display:flex;align-items:center;justify-content:center;font-size:12px;">#️⃣</div>
        <span style="font-size:12px;font-weight:700;color:#e4e4e7;letter-spacing:0.04em;">HASHTAG & DESKRIPSI SOSMED</span>
        <span style="font-size:10px;background:rgba(236,72,153,0.15);border:1px solid rgba(236,72,153,0.2);color:#f9a8d4;padding:2px 8px;border-radius:20px;">BARU</span>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
        <button id="btn-copy-hashtag" style="display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:12px;padding:10px 12px;cursor:pointer;">
          <span style="font-size:12px;color:#d4d4d8;font-weight:500;">Copy Hashtag</span>
          <span style="font-size:10px;background:rgba(255,255,255,0.08);padding:4px 8px;border-radius:20px;color:#a1a1aa;">COPY</span>
        </button>
        <button id="btn-copy-desc" style="display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:12px;padding:10px 12px;cursor:pointer;">
          <span style="font-size:12px;color:#d4d4d8;font-weight:500;">Copy Deskripsi IG/TikTok</span>
          <span style="font-size:10px;background:rgba(255,255,255,0.08);padding:4px 8px;border-radius:20px;color:#a1a1aa;">COPY</span>
        </button>
      </div>
      <button id="btn-copy-full" style="display:flex;align-items:center;justify-content:space-between;background:linear-gradient(135deg,#ec4899 0%,#8b5cf6 100%);border:none;border-radius:12px;padding:12px 14px;cursor:pointer;box-shadow:0 4px 14px rgba(236,72,153,0.25);">
        <span style="font-size:12.5px;color:#fff;font-weight:700;">Copy Paket Lengkap (Deskripsi + Hashtag)</span>
        <span style="font-size:10px;background:rgba(255,255,255,0.2);padding:4px 8px;border-radius:20px;color:#fff;">COPY</span>
      </button>
      <div id="jocy-social-preview" style="background:#0a0a0f;border:1px dashed rgba(255,255,255,0.08);border-radius:10px;padding:10px;max-height:120px;overflow:auto;font-size:11px;color:rgba(255,255,255,0.5);line-height:1.5;white-space:pre-wrap;display:none;"></div>
    `;
    gridParent.insertAdjacentElement('afterend', panel);
    
    document.getElementById('btn-copy-hashtag').addEventListener('click', function(){
      const txt = generateHashtags();
      const prev = document.getElementById('jocy-social-preview');
      prev.style.display='block'; prev.textContent = txt;
      copyText(txt, this.querySelector('span:last-child'));
    });
    document.getElementById('btn-copy-desc').addEventListener('click', function(){
      const txt = generateDescription();
      const prev = document.getElementById('jocy-social-preview');
      prev.style.display='block'; prev.textContent = txt;
      copyText(txt, this.querySelector('span:last-child'));
    });
    document.getElementById('btn-copy-full').addEventListener('click', function(){
      const txt = generateFullPackage();
      const prev = document.getElementById('jocy-social-preview');
      prev.style.display='block'; prev.textContent = txt;
      copyText(txt, this.querySelector('span:last-child'));
    });
  }
  // coba inject berulang karena React render async
  const iv = setInterval(()=>{
    if(document.querySelector('button')){ injectSocialPanel(); }
    if(document.getElementById('jocy-social-panel')){ /*clearInterval(iv);*/ }
  }, 1000);
  // juga observer
  const obs = new MutationObserver(()=>{ injectSocialPanel(); });
  obs.observe(document.body, {childList:true, subtree:true});
})();
</script>

<script id="bypass-login">
(function(){
  try{
    const fake = {name:"User", wa:"628123456789", phone:"08123456789", hp:"08123456789", id:"user-bypass", role:"user", status:"approved", isAdmin:false, at:Date.now(), lastActive:new Date().toISOString(), username:"user", wa_number:"08123456789"};
    localStorage.setItem("jocya_user", JSON.stringify(fake));
    localStorage.setItem("jocya_auth", JSON.stringify({wa:"08123456789", at:Date.now(), doc:"bypass", ...fake}));
    localStorage.setItem("jocya_v9_final", JSON.stringify({hp:"08123456789", role:"user", status:"approved", id:"user-bypass"}));
    localStorage.setItem("jocya_session", JSON.stringify(fake));
    localStorage.setItem("user", JSON.stringify(fake));
    localStorage.setItem("jocya", JSON.stringify(fake));
  }catch(e){}

  function nuke(){
    const ids=["authOverlay","auth-gate","loginGate","loginOverlay","view-login","view-register","loginWrap","pendingView","loginView","daftarView","pending-modal","pendingHp","auth-error","login-error-live","auth-reg-form","login-main","forgotModal","adminModal","loginFeedbackArea","authOverlay","loginGate"];
    ids.forEach(id=>{
      const el=document.getElementById(id);
      if(el) { try{ el.remove(); } catch{ el.style.display='none'; } }
    });
    // hide any fixed overlay that contains password input
    document.querySelectorAll('div[style*="fixed"]').forEach(el=>{
      if(el.querySelector('input[type="password"]')){
        const txt=(el.textContent||"").toLowerCase();
        if(txt.includes('masuk') || txt.includes('login') || txt.includes('password') || txt.includes('daftar')){
          if(el.id!=='root' && el.id!=='userRoot') el.style.display='none';
        }
      }
    });
    const root=document.getElementById('root'); if(root){ root.style.display='block'; root.style.visibility='visible'; root.style.opacity='1'; }
    const userRoot=document.getElementById('userRoot'); if(userRoot){ userRoot.style.display='block'; userRoot.style.visibility='visible'; }
    const formSec=document.getElementById('form-section'); if(formSec){ formSec.style.display='block'; }
    const studio=document.getElementById('view-studio'); if(studio){ studio.style.display='block'; }
    const sFrame=document.getElementById('studioFrame'); if(sFrame){ sFrame.style.display='block'; sFrame.style.height='100vh'; }
    if(document.body.classList.contains('mode-login') || document.body.className==='mode-login'){
      document.body.className='mode-user';
    }
    // index_16
    if(typeof window.showView==='function'){
      try{
        const vs=document.getElementById('view-studio');
        if(vs && vs.style.display==='none') window.showView('studio');
      }catch{}
    }
  }
  nuke();
  const obs=new MutationObserver(()=>nuke());
  obs.observe(document.documentElement,{childList:true, subtree:true});
  setInterval(nuke, 800);
  window.addEventListener('load', nuke);
  document.addEventListener('DOMContentLoaded', nuke);
})();
</script>
