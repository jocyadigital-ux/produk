<script type="module">

const firebaseConfig = {
  apiKey: "AIzaSyAtiw8OXoNmG4L5GyZuBU6ksZ-eU1zmW9U",

const COL_USERS="users_v2";const COL_PRODUCTS="products_v2";const COL_REQUEST="tool_requests_v2";const COL_FEEDBACK="feedback_v2";const COL_MASUKAN="masukan_v2";const COL_TABS="tabs_config_v2";
const app=initializeApp(firebaseConfig);const db=getFirestore(app);
const DEFAULT_PRODUCTS=["KUMPULAN GENERATOR 7 IN 1 - FULL","SEMUA PRODUK - FULL ACCESS","GENERET VIDEO DAN FOTO","REFERENSI FOTO","PROMPT FILM","PROMPT IKLAN","PROMPT VIDEO PRO","TIMELAPSE PROMPT GENERATOR PRO","CIPTA LAGU"];
let TOOLS=[
  {file:"generet_video_dan_foto.html",title:"Generet Video Dan Foto",short:"VIDEO & FOTO",product:"GENERET VIDEO DAN FOTO",badge:"VIDEO",color:"from-emerald-600 to-teal-600"},
  {file:"referensifoto.html",title:"Referensi Foto",short:"REFERENSI FOTO",product:"REFERENSI FOTO",badge:"FOTO",color:"from-orange-600 to-amber-600"},
  {file:"prompt_film.html",title:"Prompt Film",short:"PROMPT FILM",product:"PROMPT FILM",badge:"FILM",color:"from-pink-600 to-rose-600"},
  {file:"promptiklan.html",title:"Prompt Iklan",short:"PROMPT IKLAN",product:"PROMPT IKLAN",badge:"IKLAN",color:"from-blue-600 to-cyan-600"},
  {file:"Prompt_Video_Pro.html",title:"Prompt Video Pro",short:"PROMPT VIDEO PRO",product:"PROMPT VIDEO PRO",badge:"PRO",color:"from-purple-600 to-fuchsia-600"},
  {file:"Timelapse_Prompt_Generator_Pro.html",title:"Timelapse Prompt Generator Pro",short:"TIMELAPSE",product:"TIMELAPSE PROMPT GENERATOR PRO",badge:"TIME",color:"from-slate-600 to-zinc-600"},
  {file:"cipta_lagu.html",title:"Cipta Lagu",short:"CIPTA LAGU",product:"CIPTA LAGU",badge:"MUSIC",color:"from-fuchsia-600 to-pink-600"},
];


function getDynamicToolsForProducts(userProducts){
  // untuk produk yang tidak ada di TOOLS, buatkan tab dinamis otomatis
  const knownProducts = TOOLS.map(t=>t.product);
  const renameMap = window._productRenameMap||{};
  const dynamic = [];
  userProducts.forEach(prodName=>{
    if(isFullAccess([prodName])) return;
    // cek apakah prodName sudah ter-cover oleh TOOLS (baik nama lama atau baru)
    let covered = TOOLS.some(t=>{
      if(t.product===prodName) return true;
      if(renameMap[t.product]===prodName) return true;
      return false;
    });
    if(!covered){
      // buat tool dinamis
      // coba tebak file: jika mengandung CIPTA LAGU pakai cipta_lagu.html, jika tidak pakai file generik
      let file = prodName.toLowerCase().includes('cipta') ? 'cipta_lagu.html' : 
                 prodName.toLowerCase().includes('lagu') ? 'cipta_lagu.html' :
                 'generic_tool.html';
      dynamic.push({
        file: file,
        title: prodName,
        short: prodName.toUpperCase(),
        product: prodName,
        displayProduct: prodName,
        displayShort: prodName.toUpperCase(),
        badge: "NEW",
        color: "from-amber-600 to-orange-600",
        isDynamic: true
      });
    }
  });
  return dynamic;
}

let state={view:'login',products:DEFAULT_PRODUCTS.map(n=>({name:n})),tools:TOOLS,toast:null,currentUser:null,selectedTool:TOOLS[0],pendingWa:'',showRequest:false,requestText:'',registerSelection:[], availableToRequest:[], requestSelection:[], showFeedback:false, feedbackType:"error", feedbackTool:""};
function esc(str){return (str||'').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');}
function getSession(){try{return JSON.parse(localStorage.getItem('jocya_user')||'null')}catch{return null}}
function saveSession(u){localStorage.setItem('jocya_user',JSON.stringify(u));}
function clearSession(){localStorage.removeItem('jocya_user');}
function normalizeWa(v){let s=(v||'').toString().replace(/[^0-9]/g,''); if(s.startsWith('62')) s='0'+s.slice(2); return s;}
function toast(msg,type='success'){state.toast={msg:esc(msg),type}; render(); setTimeout(()=>{state.toast=null;render()},3000);}
function getUserProducts(u){if(!u) return []; if(u.products && Array.isArray(u.products) && u.products.length>0) return u.products; if(u.product) return [u.product]; return [];}
function mergeProducts(arr){
  let deletedDefaults = new Set();
  let mapOldToNew = {};
  let customs = [];
  arr.forEach(p=>{
    if(p.name && p.name.startsWith('__DELETED__')){ deletedDefaults.add(p.deletedDefault||''); }
    else if(p.name){
      customs.push({id:p.id, name:p.name, oldName:p.oldName||''});
      if(p.oldName) mapOldToNew[p.oldName]=p.name;
    }
  });
  let merged=[...DEFAULT_PRODUCTS].filter(n=> !deletedDefaults.has(n));
  customs.forEach(c=>{ if(!merged.includes(c.name)) merged.push(c.name); });
  // build final with old mapping
  window._productRenameMap = mapOldToNew; // global map
  window._customProducts = customs;
  return [...new Set(merged)].map(name=>{
    let found = customs.find(c=>c.name===name);
    return {id:found?.id||'def', name, oldName:found?.oldName||''};
  });
}
function isFullAccess(products){if(!products) return false; return products.some(p=>{const up=(p||'').toUpperCase().trim(); return up==='KUMPULAN GENERATOR 7 IN 1 - FULL' || up==='SEMUA PRODUK - FULL ACCESS' || up.includes('7 IN 1');});}
onSnapshot(collection(db,COL_PRODUCTS),(snap)=>{let arr=[];snap.forEach(d=>arr.push({id:d.id,...d.data()})); if(arr.length===0) state.products=DEFAULT_PRODUCTS.map(name=>({name})); else state.products=mergeProducts(arr); render();},(err)=>{console.error(err);});
onSnapshot(collection(db,COL_TABS),(snap)=>{
  let arr=[];snap.forEach(d=>arr.push({id:d.id, ...d.data()}));
  arr.sort((a,b)=>(a.order||0)-(b.order||0));
  if(arr.length>0){
    // build TOOLS from tabs config
    TOOLS = arr.filter(t=> t.visible!==false).map(t=>({
      file: t.file,
      title: t.title||t.product,
      short: t.short||t.product,
      product: t.product,
      badge: t.badge||'NEW',
      color: t.color||'from-violet-600 to-indigo-600',
      displayProduct: t.product,
      displayShort: t.short||t.product
    }));
    // update selectedTool if needed
    if(state.currentUser){
      let prods=getUserProducts(state.currentUser);
      let avail=getAvailableTools(prods);
      if(avail.length>0 && !avail.find(a=>a.file===state.selectedTool.file)){
        state.selectedTool = avail[0];
      }
    }
    render();
  }
},(err)=>{console.error('tabs err',err);});

function getAvailableTools(products){
  if(!products||products.length===0) return [];
  const renameMap = window._productRenameMap || {};
  // reverse map new->old untuk cari
  const reverseMap = {};
  Object.entries(renameMap).forEach(([oldN,newN])=>{ reverseMap[newN]=oldN; });
  if(isFullAccess(products)){
    return TOOLS.map(t=>{
      let currentName = renameMap[t.product] || t.product;
      return {...t, displayProduct: currentName, displayShort: currentName};
    });
  }
  // filter tools yang user punya, baik nama lama atau baru
  return TOOLS.filter(t=>{
    if(products.includes(t.product)) return true;
    let newName = renameMap[t.product];
    if(newName && products.includes(newName)) return true;
    // cek apakah ada produk user yang oldName-nya adalah t.product
    return false;
  }).map(t=>{
    let newName = renameMap[t.product];
    let actual = (newName && products.includes(newName)) ? newName : t.product;
    return {...t, displayProduct: actual, displayShort: actual};
  });
}
let sess=getSession(); if(sess&&sess.status==='approved'){state.currentUser=sess; state.view='app'; let prods=getUserProducts(sess); let avail=getAvailableTools(prods); state.selectedTool=avail[0]||TOOLS[0];}
window.setTool=(file)=>{let tool=TOOLS.find(t=>t.file===file)||TOOLS[0]; state.selectedTool=tool; render(); setTimeout(()=>{ tryLoadTool(); },100);};
window.openToolNewTab=()=>{if(state.selectedTool&&state.selectedTool.file) window.open(state.selectedTool.file,'_blank');};
window.reloadTool=()=>{ tryLoadTool(); };
window.tryLoadTool=()=>{
  const container = document.getElementById('toolContainer');
  const notice = document.getElementById('blockNotice');
  if(!container) return;
  const isMetaPreview = window.location.hostname.includes('meta.ai') || window.location.hostname.includes('metaausercontent') || window.location.hostname.includes('facebook');
  if(isMetaPreview){
    // di preview meta.ai, jangan pakai iframe, tampilkan kartu buka baru
    container.innerHTML = `
      <div class="w-full h-full overflow-auto p-4">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-3 max-w-4xl mx-auto">
          ${TOOLS.map(t=>`
            <div class="group p-4 rounded-2xl border ${state.selectedTool.file===t.file?'border-white bg-white text-black':'border-white/10 bg-white/[0.04] hover:bg-white/[0.08]'} cursor-pointer" onclick="setTool('${t.file}')">
              <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-br ${t.color} flex items-center justify-center text-[10px] font-bold text-white shrink-0">${t.badge}</div>
                <div class="flex-1 min-w-0">
                  <div class="font-bold text-sm truncate">${t.displayShort||t.short}</div>
                  <div class="text-[10px] opacity-70 truncate">${t.displayProduct||t.product}</div>
                  <div class="text-[9px] opacity-50 truncate mt-1">${t.file}</div>
                </div>
                <div class="text-[10px]">${state.selectedTool.file===t.file?'● AKTIF':'→'}</div>
              </div>
              <button onclick="event.stopPropagation(); window.open('${t.file}','_blank')" class="mt-3 w-full h-8 rounded-full ${state.selectedTool.file===t.file?'bg-black text-white':'bg-white text-black'} text-[11px] font-bold">Buka ${t.displayShort||t.short}</button>
            </div>
          `).join('')}
        </div>
        <div class="text-center mt-6 p-4 rounded-xl bg-white/5 border border-white/10 max-w-2xl mx-auto">
          <p class="text-xs font-bold">ℹ️ Mode Preview Meta AI</p>
          <p class="text-[11px] text-slate-400 mt-1">Iframe di-block di meta.ai, jadi tampil mode kartu. Klik Buka untuk lihat tool di tab baru. Kalau sudah upload ke hosting kamu (misal cPanel / Vercel), ganti ke mode iframe otomatis jalan.</p>
        </div>
      </div>
    `;
    if(notice) notice.classList.add('hidden');
    return;
  }
  // mode normal hosting - pakai iframe
  container.innerHTML = `<iframe id="toolFrame" src="${state.selectedTool.file}" class="w-full h-full border-0 bg-[#070a14]" onload="document.getElementById('blockNotice')?.classList.add('hidden')" onerror="document.getElementById('blockNotice')?.classList.remove('hidden')"></iframe>`;
  // detect block after 3s
  setTimeout(()=>{
    try{
      const iframe = document.getElementById('toolFrame');
      if(!iframe) return;
      // jika iframe contentWindow null atau blocked, show notice
      if(!iframe.contentWindow || iframe.contentDocument?.body?.innerHTML?.includes('Firefox Can')){
        if(notice) notice.classList.remove('hidden');
      }
    }catch(e){
      // cross-origin error means blocked
      if(notice) notice.classList.remove('hidden');
    }
  },2500);
};

window.go=(v)=>{state.view=v; render();};
window.toggleRegisterProd=(idx)=>{const prodName=state.products[idx]?.name; if(!prodName) return; if(isFullAccess([prodName])){state.registerSelection=state.registerSelection.includes(prodName)?[]:[prodName]; render(); return;} if(isFullAccess(state.registerSelection)) state.registerSelection=[]; let pos=state.registerSelection.indexOf(prodName); if(pos>=0) state.registerSelection.splice(pos,1); else {if(state.registerSelection.length>=7){toast('Maksimal 7','error'); return;} state.registerSelection.push(prodName);} render();};
let pendingRequests = [];
window.openRequest=()=>{
  const prods=getUserProducts(state.currentUser);
  // tools yang belum dimiliki
  state.availableToRequest = TOOLS.filter(t=> !prods.includes(t.product) && !isFullAccess(prods));
  state.requestSelection = [];
  state.showRequest=true; 
  render();
};
window.closeRequest=()=>{state.showRequest=false; render();};
window.toggleRequestTool=(file)=>{
  let idx=state.requestSelection.indexOf(file);
  if(idx>=0) state.requestSelection.splice(idx,1); else state.requestSelection.push(file);
  render();
};
window.submitRequest=async()=>{
  if(!state.requestSelection || state.requestSelection.length===0){
    toast('Pilih minimal 1 tool yang mau diminta','error'); return;
  }
  const alasan=document.getElementById('req_alasan')?.value.trim()||'';
  const linkref=document.getElementById('req_link')?.value.trim()||'';
  const prioritas=document.getElementById('req_prioritas')?.value||'Normal';
  const tambahan=document.getElementById('req_tambahan')?.value.trim()||'';
  if(!alasan || alasan.length<10){
    toast('Isi alasan minimal 10 karakter kenapa butuh tool ini','error'); 
    document.getElementById('req_alasan')?.focus();
    return;
  }
  try{
    let sess=getSession(); if(!sess||!sess.wa){toast('Session habis','error'); return;}
    let selectedTools = state.requestSelection.map(file=>TOOLS.find(t=>t.file===file)).filter(Boolean);
    for(let t of selectedTools){
      await addDoc(collection(db,COL_REQUEST),{
        wa:sess.wa,
        name:sess.name||'User',
        requestedFile:t.file,
        requestedTitle:t.title,
        requestedProduct:t.product,
        alasan: alasan,
        linkReferensi: linkref,
        prioritas: prioritas,
        catatanTambahan: tambahan,
        message: `${t.title} - Alasan: ${alasan} | Prioritas: ${prioritas} ${linkref? '| Ref: '+linkref : ''} ${tambahan? '| Note: '+tambahan : ''}`,
        currentProducts:getUserProducts(sess),
        status:'pending',
        createdAt:serverTimestamp()
      });
      await addDoc(collection(db,COL_FEEDBACK),{
        wa:sess.wa, name:sess.name||'User', type:'Request Tool Baru', 
        message: `Minta: ${t.title} (${t.product}) | Alasan: ${alasan} | Prioritas: ${prioritas}`,
        tool:t.title, product:t.product,
        alasan, linkref, prioritas, tambahan,
        products:getUserProducts(sess), status:'new', createdAt:serverTimestamp()
      });
    }
    toast(`✅ ${selectedTools.length} request terkirim! Admin akan review.`);
    state.showRequest=false; state.requestSelection=[]; render();
  }catch(e){toast(e.message,'error');}
};

window.openFeedback=()=>{
  state.showFeedback=true;
  state.feedbackTool = state.selectedTool?.file || '';
  state.feedbackType = 'error';
  render();
};
window.closeFeedback=()=>{state.showFeedback=false; render();};
window.setFeedbackType=(t)=>{state.feedbackType=t; render();};
window.submitFeedback=async()=>{
  const desc=document.getElementById('fb_desc')?.value.trim()||'';
  const link=document.getElementById('fb_link')?.value.trim()||'';
  const toolFile=document.getElementById('fb_tool')?.value||state.selectedTool?.file||'';
  const type=state.feedbackType||'error';
  if(!desc || desc.length<10){
    toast('Jelaskan error / fitur minimal 10 karakter','error');
    return;
  }
  try{
    let sess=getSession(); if(!sess||!sess.wa){toast('Session habis','error'); return;}
    let toolObj = TOOLS.find(t=>t.file===toolFile);
    await addDoc(collection(db,COL_MASUKAN),{
      wa:sess.wa,
      name:sess.name||'User',
      type: type,
      toolFile: toolFile,
      toolTitle: toolObj?.title||'Umum',
      toolProduct: toolObj?.product||'',
      deskripsi: desc,
      link: link,
      currentTool: state.selectedTool?.title||'',
      status:'baru',
      createdAt:serverTimestamp()
    });
    await addDoc(collection(db,COL_FEEDBACK),{
      wa:sess.wa, name:sess.name||'User', type: type==='error'?'Lapor Error':'Request Fitur',
      message: `${type==='error'?'ERROR':'FITUR'} di ${toolObj?.title||toolFile}: ${desc} ${link?' | '+link:''}`,
      tool: toolObj?.title||toolFile, status:'new', createdAt:serverTimestamp()
    });
    toast(`Berhasil kirim ${type==='error'?'laporan error':'masukan fitur'}!`);
    state.showFeedback=false; render();
  }catch(e){toast(e.message,'error');}
};

window.doLogin=async()=>{
  const wa=normalizeWa(document.getElementById('wa').value); const pass=document.getElementById('pass').value;
  if(!wa||!pass){toast('Lengkapi WA & Password','error'); return;}
  try{
    const q1=query(collection(db,COL_USERS),where("wa","==",wa)); const q2=query(collection(db,COL_USERS),where("hp","==",wa));
    let s1=await getDocs(q1); let s2=await getDocs(q2); let map=new Map(); [...s1.docs,...s2.docs].forEach(d=>map.set(d.id,d)); let docs=[...map.values()];
    if(docs.length===0){toast('WA belum terdaftar','error'); return;}
    let data=docs[0].data(); if(data.password!==pass){toast('Password salah','error'); return;}
    if(data.status==='pending'){state.view='pending'; state.pendingWa=wa; render(); return;}
    if(data.status==='rejected'){toast('Ditolak admin','error'); return;}
    let userProds=getUserProducts(data); if(userProds.length===0){toast('Belum punya produk','error'); return;}
    saveSession({wa,name:data.name||'User',products:userProds,status:'approved'});
    state.currentUser={...data,wa,products:userProds}; state.view='app'; let avail=getAvailableTools(userProds); state.selectedTool=avail[0]||TOOLS[0]; render();
  }catch(e){toast(e.message,'error');}
};
window.doRegister=async()=>{
  const wa=normalizeWa(document.getElementById('r_wa').value); const pass=document.getElementById('r_pass').value; const conf=document.getElementById('r_conf').value; const selectedProds=state.registerSelection;
  if(!wa||!pass){toast('Lengkapi WA & Password','error'); return;} if(selectedProds.length===0){toast('Pilih minimal 1 produk','error'); return;} if(wa.length<10){toast('WA tidak valid','error'); return;} if(pass.length<6){toast('Min 6 karakter','error'); return;} if(pass!==conf){toast('Password konfirmasi beda','error'); return;}
  const name = 'User ' + wa.slice(-4);
  try{const q1=query(collection(db,COL_USERS),where("wa","==",wa)); const q2=query(collection(db,COL_USERS),where("hp","==",wa)); let s1=await getDocs(q1); let s2=await getDocs(q2); if(!s1.empty||!s2.empty){toast('WA sudah ada','error'); return;} await addDoc(collection(db,COL_USERS),{name,wa,hp:wa,products:selectedProds,product:selectedProds[0],password:pass,status:"pending",createdAt:serverTimestamp()}); state.view='pending'; state.pendingWa=wa; state.registerSelection=[]; render();}catch(e){toast(e.message,'error');}
};
window.doLogout=()=>{clearSession(); state.view='login'; state.currentUser=null; render();};

function render(){
  const root=document.getElementById('root');
  const t = state.toast ? `<div class="fixed top-4 right-4 z-[9999] px-4 py-3 rounded-xl text-sm shadow-2xl ${state.toast.type==='error'?'bg-red-600':'bg-emerald-600'} text-white">${state.toast.msg}</div>` : '';
  if(state.view==='login'){

          <div class="flex gap-2 mt-4 justify-between items-center">
            <div class="text-[11px] text-slate-400">${(state.requestSelection||[]).length} dipilih</div>
            <div class="flex gap-2"><button onclick="closeRequest()" class="h-9 px-4 rounded-full bg-white/10 text-xs">Batal</button><button onclick="submitRequest()" class="h-9 px-5 rounded-full bg-cyan-500 text-black text-xs font-bold disabled:opacity-50" ${(state.requestSelection||[]).length===0?'disabled':''}>Kirim Request</button></div>
          </div>
        </div>
      </div>` : ''}
            ${state.showFeedback ? `
      <div class="fixed inset-0 z-[60] bg-black/80 backdrop-blur flex items-center justify-center p-3">
        <div class="glass-strong rounded-2xl w-full max-w-lg max-h-[90vh] overflow-hidden flex flex-col">
          <div class="p-5 pb-3 border-b border-white/5">
            <div class="flex items-center justify-between">
              <h3 class="font-bold font-display">Kolom Masukan</h3>
              <button onclick="closeFeedback()" class="w-7 h-7 rounded-full bg-white/10 flex items-center justify-center">X</button>
            </div>
            <p class="text-[11px] text-slate-400 mt-1">Lapor error atau minta tambah fitur di tool</p>
          </div>
          <div class="flex-1 overflow-y-auto p-5 space-y-4">
            <div class="flex gap-2">
              <button onclick="setFeedbackType('error')" class="flex-1 h-10 rounded-xl border text-xs font-bold flex items-center justify-center gap-1.5 ${state.feedbackType==='error'?'bg-red-500 text-white border-red-500':'bg-white/5 border-white/10 text-slate-300'}">Ada Error</button>
              <button onclick="setFeedbackType('fitur')" class="flex-1 h-10 rounded-xl border text-xs font-bold flex items-center justify-center gap-1.5 ${state.feedbackType==='fitur'?'bg-emerald-500 text-white border-emerald-500':'bg-white/5 border-white/10 text-slate-300'}">Tambah Fitur</button>
            </div>
            <div>
              <label class="text-[11px] font-semibold">Tool Terkait</label>
              <select id="fb_tool" class="w-full mt-1 h-10 px-3 rounded-xl bg-[#0f172a] border border-white/10 text-xs">
                ${TOOLS.map(t=>`<option value="${t.file}" ${state.feedbackTool===t.file?'selected':''}>${t.title} - ${t.product}</option>`).join('')}
                <option value="umum">Umum / Lainnya</option>
              </select>
            </div>
            <div>
              <label class="text-[11px] font-semibold">${state.feedbackType==='error'?'Deskripsi Error *':'Deskripsi Fitur Yang Diinginkan *'}</label>
              <textarea id="fb_desc" class="w-full mt-1 h-28 p-3 rounded-xl bg-white/5 border border-white/10 text-xs outline-none focus:border-violet-500 resize-none" placeholder="${state.feedbackType==='error'?'Contoh: Tool Green Screen error saat upload video, muncul blank putih di Chrome...':'Contoh: Tolong tambahin fitur export 4K, atau template text animasi baru'}"></textarea>
            </div>
            <div>
              <label class="text-[11px] font-semibold">Link Screenshot / Video (opsional)</label>
              <input id="fb_link" type="url" class="w-full mt-1 h-10 px-3 rounded-xl bg-white/5 border border-white/10 text-xs outline-none" placeholder="https://drive.google.com/...">
            </div>
          </div>
          <div class="p-4 border-t border-white/5 flex justify-end gap-2 bg-[#0f172a]/50">
            <button onclick="closeFeedback()" class="h-9 px-4 rounded-full bg-white/10 text-xs">Batal</button>
            <button onclick="submitFeedback()" class="h-9 px-5 rounded-full ${state.feedbackType==='error'?'bg-red-500':'bg-emerald-500'} text-white text-xs font-bold">Kirim</button>
          </div>
        </div>
      </div>` : ''}
      ${t}
    </div>`;
    setTimeout(()=>{ if(state.view==='app') tryLoadTool(); },200);
    return;
  }
}
render();
setTimeout(()=>{ if(state.view==='app') tryLoadTool(); },500);
</script>
</body>
</html>
